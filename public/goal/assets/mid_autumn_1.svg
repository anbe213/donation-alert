<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bg1)"/>
  <!-- Star Lantern Ring -->
  <circle cx="80" cy="80" r="55" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
  <!-- Bamboo Handle -->
  <line x1="80" y1="135" x2="80" y2="155" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <!-- Star Shape (Đèn Ông Sao) -->
  <polygon points="80,28 95,65 135,68 104,95 114,133 80,110 46,133 56,95 25,68 65,65" fill="url(#starGlow)" stroke="#fef08a" stroke-width="2"/>
  <!-- Center circle -->
  <circle cx="80" cy="80" r="14" fill="#dc2626" stroke="#fef08a" stroke-width="2"/>
  <!-- Sparkling stars -->
  <circle cx="35" cy="35" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="125" cy="40" r="2.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="130" cy="120" r="1.5" fill="#fef08a" opacity="0.7"/>
</svg>
