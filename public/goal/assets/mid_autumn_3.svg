<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </radialGradient>
    <radialGradient id="lionHead" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bg3)"/>
  <!-- Lion Mane Fur -->
  <circle cx="80" cy="80" r="50" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <!-- Lion Horn / Mirror on forehead -->
  <polygon points="80,24 88,48 72,48" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="80" cy="48" r="8" fill="#38bdf8" stroke="#fef08a" stroke-width="2"/>
  <!-- Lion Head Core -->
  <circle cx="80" cy="84" r="38" fill="url(#lionHead)" stroke="#fef08a" stroke-width="2"/>
  <!-- Big Eyes -->
  <ellipse cx="64" cy="74" rx="12" ry="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="66" cy="74" r="6" fill="#111827"/>
  <circle cx="68" cy="72" r="2" fill="#ffffff"/>
  
  <ellipse cx="96" cy="74" rx="12" ry="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="94" cy="74" r="6" fill="#111827"/>
  <circle cx="96" cy="72" r="2" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 50 62 Q 65 52 76 65" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 110 62 Q 95 52 84 65" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Snout / Nose -->
  <ellipse cx="80" cy="88" rx="8" ry="6" fill="#f59e0b"/>
  <!-- Mouth / Beard -->
  <path d="M 58 100 Q 80 120 102 100" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <path d="M 64 100 L 67 106 L 73 100 L 79 106 L 85 100 L 91 106 L 96 100" fill="#fef08a"/>
</svg>
