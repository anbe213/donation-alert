<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#140824"/>
    </radialGradient>
    <radialGradient id="cakeGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>
  <rect width="160" height="160" fill="url(#bg2)"/>
  <!-- Shadow -->
  <ellipse cx="80" cy="125" rx="50" ry="15" fill="rgba(0,0,0,0.5)"/>
  <!-- Mooncake Base (Scalloped Edges) -->
  <circle cx="80" cy="78" r="48" fill="url(#cakeGrad)" stroke="#451a03" stroke-width="2"/>
  <circle cx="80" cy="78" r="40" fill="none" stroke="#78350f" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="80" cy="78" r="32" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <!-- Center Flower Pattern -->
  <circle cx="80" cy="78" r="16" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
  <circle cx="80" cy="66" r="6" fill="#78350f" opacity="0.6"/>
  <circle cx="80" cy="90" r="6" fill="#78350f" opacity="0.6"/>
  <circle cx="68" cy="78" r="6" fill="#78350f" opacity="0.6"/>
  <circle cx="92" cy="78" r="6" fill="#78350f" opacity="0.6"/>
  <!-- Center Stamp character / icon -->
  <text x="80" y="83" font-size="13" font-family="'Palatino', serif" font-weight="bold" fill="#451a03" text-anchor="middle">秋</text>
  <!-- Sparkles -->
  <circle cx="30" cy="45" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="130" cy="45" r="2" fill="#fef08a" opacity="0.8"/>
</svg>
