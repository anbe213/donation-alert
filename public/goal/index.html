<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Goal Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- THEME 1: POTION (Bình máu) -->
    <div id="theme-potion" style="display: none;">
        <div id="goal-container">
            <div id="goal-title">Loading Goal...</div>
            
            <div id="widget-body">
                <div id="rotated-flask">
                    <div id="cork"></div>
                    <div id="flask">
                        <div id="liquid"></div>
                        <div id="glass-reflection"></div>
                    </div>
                </div>
                <div id="percent-text">0%</div>
            </div>

            <div id="goal-text">0 / 0</div>
        </div>
    </div>

    <!-- THEME 2: BAR (Thanh ngang) -->
    <div id="theme-bar" style="display: none;">
        <div id="goal-bar-container">
            <!-- Nhân vật chạy trên thanh -->
            <img id="bar-character" src="" alt="enemy">

            <!-- Phần chứa background xám và thanh trượt màu xanh -->
            <div id="progress-bar-bg">
                <div id="progress-fill"></div>
            </div>

            <!-- Phần chữ đè lên trên thanh progress -->
            <div id="text-overlay">
                <div id="bar-title-text" class="text-left">Loading...</div>
                <div id="bar-current-text" class="text-center">0</div>
                <div id="bar-target-text" class="text-right">0</div>
            </div>
        </div>
    </div>

    <!-- THEME 3: MID-AUTUMN (Trung Thu - Khung ảnh lớn làm tâm điểm) -->
    <div id="theme-mid-autumn" style="display: none;">
        <div id="mid-autumn-card">
            <!-- Khung ảnh lớn sang trọng (Tâm điểm chính, tĩnh, khóa viền 100% không tràn) -->
            <div id="mid-autumn-frame">
                <img id="mid-autumn-photo" class="frame-photo" src="" alt="Goal Photo">
                <!-- Placeholder khi ảnh chưa tải được hoặc chưa cấu hình -->
                <div id="mid-autumn-placeholder" class="frame-placeholder">
                    <div class="placeholder-icon">🥮</div>
                    <div class="placeholder-text">Trung Thu</div>
                </div>
            </div>

            <!-- Thanh donate nhỏ liền kề bên dưới làm nơi chứa title và thanh tiến trình -->
            <div id="mid-autumn-bar-wrapper">
                <div id="mid-autumn-bar-bg">
                    <!-- Thanh fill tiến trình màu vàng ánh trăng -->
                    <div id="mid-autumn-progress-fill"></div>
                </div>

                <!-- Tiêu đề của bậc Goal hiện tại (Ẩn toàn bộ số tiền) -->
                <div id="mid-autumn-title-overlay">
                    <span id="mid-autumn-title-text">Loading Goal...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
