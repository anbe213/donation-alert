<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Like Goal Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="like-widget-wrapper">
        <!-- Vùng chứa các giọt nước rơi từ trên xuống -->
        <div id="droplets-container"></div>

        <!-- Chiếc bình thủy tinh ma thuật -->
        <div id="jar-container">
            <!-- Khung bình thủy tinh SVG viền đồng giả cổ -->
            <svg id="jar-svg" viewBox="0 0 160 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- ClipPath khớp 100% với hình dáng thân bình -->
                    <clipPath id="jar-inner-clip">
                        <path d="M 54 24 L 54 48 L 24 92 C 8 116 8 184 26 202 C 44 218 116 218 134 202 C 152 184 152 116 136 92 L 106 48 L 106 24 Z"/>
                    </clipPath>

                    <!-- Gradient chất lỏng ma thuật xanh biển pha lê -->
                    <linearGradient id="liquid-gradient" x1="0" y1="1" x2="0" y2="0">
                        <stop offset="0%" stop-color="#083344"/>
                        <stop offset="30%" stop-color="#0e7490"/>
                        <stop offset="65%" stop-color="#06b6d4"/>
                        <stop offset="90%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#bae6fd"/>
                    </linearGradient>

                    <!-- Gradient ánh sáng tâm chất lỏng -->
                    <radialGradient id="liquid-core-glow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.5"/>
                        <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2"/>
                        <stop offset="100%" stop-color="#083344" stop-opacity="0"/>
                    </radialGradient>
                </defs>

                <!-- Lớp 1: Mặt kính phía sau bình (mờ nhẹ) -->
                <path d="M 54 24 L 54 48 L 24 92 C 8 116 8 184 26 202 C 44 218 116 218 134 202 C 152 184 152 116 136 92 L 106 48 L 106 24 Z" 
                      fill="rgba(6, 182, 212, 0.04)"/>

                <!-- Lớp 2: Dung dịch ma thuật (bị cắt gọt chuẩn xác theo lòng bình) -->
                <g clip-path="url(#jar-inner-clip)">
                    <!-- Thân dung dịch nước xanh -->
                    <rect id="svg-liquid-body" x="0" y="218" width="160" height="0" fill="url(#liquid-gradient)"/>

                    <!-- Tâm phát sáng ma thuật bên trong nước -->
                    <g id="svg-liquid-glow" opacity="0">
                        <ellipse cx="80" cy="140" rx="45" ry="60" fill="url(#liquid-core-glow)"/>
                    </g>

                    <!-- Bọt khí ma thuật lơ lửng -->
                    <g id="svg-bubbles" opacity="0">
                        <circle class="svg-bubble sb1" cx="55" cy="180" r="2.5" fill="rgba(255, 255, 255, 0.7)"/>
                        <circle class="svg-bubble sb2" cx="85" cy="190" r="3.5" fill="rgba(255, 255, 255, 0.6)"/>
                        <circle class="svg-bubble sb3" cx="105" cy="165" r="2" fill="rgba(255, 255, 255, 0.8)"/>
                        <circle class="svg-bubble sb4" cx="70" cy="150" r="3" fill="rgba(255, 255, 255, 0.5)"/>
                        <circle class="svg-bubble sb5" cx="95" cy="175" r="2" fill="rgba(255, 255, 255, 0.75)"/>
                        <circle class="svg-bubble sb6" cx="65" cy="198" r="4" fill="rgba(255, 255, 255, 0.4)"/>
                    </g>

                    <!-- Bề mặt sóng nước nhấp nhô -->
                    <g id="svg-wave-group" transform="translate(0, 218)" opacity="0">
                        <path class="svg-wave wave-back" d="M -160 0 Q -120 -4 -80 0 T 0 0 T 80 0 T 160 0 T 240 0 T 320 0 V 15 H -160 Z" fill="#38bdf8" opacity="0.6"/>
                        <path class="svg-wave wave-front" d="M -160 0 Q -120 4 -80 0 T 0 0 T 80 0 T 160 0 T 240 0 T 320 0 V 15 H -160 Z" fill="#e0f2fe" opacity="0.8"/>
                    </g>
                </g>

                <!-- Lớp 3: Viền đồng giả cổ bao quanh bình (vẽ đè lên trên để khóa mép 100%) -->
                <path d="M 54 24 L 54 48 L 24 92 C 8 116 8 184 26 202 C 44 218 116 218 134 202 C 152 184 152 116 136 92 L 106 48 L 106 24 Z" 
                      fill="none" 
                      stroke="#a36e2c" 
                      stroke-width="4.5"
                      stroke-linejoin="round"/>

                <!-- Lớp 4: Vệt phản quang ánh sáng trên kính -->
                <path d="M 30 105 C 22 130 22 172 36 192" 
                      stroke="rgba(255, 255, 255, 0.4)" 
                      stroke-width="3.5" 
                      stroke-linecap="round"/>
                <path d="M 42 115 C 38 132 38 160 46 175" 
                      stroke="rgba(255, 255, 255, 0.2)" 
                      stroke-width="2" 
                      stroke-linecap="round"/>
                <path d="M 130 105 C 138 130 138 172 124 192" 
                      stroke="rgba(255, 255, 255, 0.15)" 
                      stroke-width="2" 
                      stroke-linecap="round"/>

                <!-- Lớp 5: Nắp gỗ / đồng miệng bình -->
                <rect x="48" y="10" width="64" height="14" rx="4" fill="#603014" stroke="#c28835" stroke-width="2.5"/>
                <rect x="58" y="4" width="44" height="8" rx="2" fill="#82461d" stroke="#d49b42" stroke-width="1.5"/>
                <!-- Miệng bình -->
                <ellipse cx="80" cy="24" rx="28" ry="6" fill="#1b120c" stroke="#c28835" stroke-width="2"/>
            </svg>
        </div>

        <!-- Bảng hiển thị thông số và tiến trình (Phong cách Medieval Fantasy) -->
        <div id="like-text-box">
            <div id="like-title">SỐ LIKE</div>
            <div id="like-counter">
                <span id="like-current">0</span> <span class="divider">/</span> <span id="like-target">100</span>
            </div>
            <div id="like-percent-badge">0% HOÀN THÀNH</div>
        </div>
    </div>

    <!-- Script kết nối Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
