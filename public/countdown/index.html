<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Countdown Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="countdown-wrapper">
        <!-- Nhân vật chạy trên thanh -->
        <img id="cd-character" src="" alt="enemy" onerror="this.src=this.src.replace('.webp', '.gif')">

        <div id="countdown-bar-container">
            <div id="countdown-bar-fill"></div>
            <div id="countdown-bar-content">
                <div id="cd-title">TITLE</div>
                <div id="cd-middle">DATE A</div>
                <div id="cd-end">DATE B</div>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
